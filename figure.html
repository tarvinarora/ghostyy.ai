<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
  #stage { position: absolute; inset: 0; }

  /* speech bubble */
  #bubble {
    position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%) scale(.6);
    width: 168px; box-sizing: border-box; padding: 9px 12px;
    background: #fff; color: #2b2540; border-radius: 14px; font-size: 12.5px; line-height: 1.35;
    box-shadow: 0 6px 20px rgba(40, 20, 80, .22); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s cubic-bezier(.3,1.6,.6,1);
    cursor: pointer;
  }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
    border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
  #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }
  #bubble b { color: var(--accent, #7b5cff); }
  #bubble.list { width: 192px; text-align: left; }
  #bubble .h { display: block; margin: 5px 0 1px; font-size: 10.5px; font-weight: 650; text-transform: uppercase;
    letter-spacing: .04em; color: #8a84a0; }
  #bubble .i { display: block; padding-left: 10px; text-indent: -10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #bubble .i::before { content: "•"; display: inline-block; width: 10px; text-indent: 0; color: var(--accent, #7b5cff); }
  #bubble .w { display: block; padding-left: 10px; font-size: 11px; color: #8a84a0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  /* ghost */
  #ghost {
    position: absolute; left: 50%; bottom: 14px; width: 112px; height: 128px; margin-left: -56px;
    cursor: grab; animation: float 3.2s ease-in-out infinite;
    filter: drop-shadow(0 8px 12px rgba(60, 30, 120, .25));
  }
  #ghost:active { cursor: grabbing; }
  #art { width: 100%; height: 100%; }
  #ghost.a-hover  { animation: hover 2.4s ease-in-out infinite; }
  #ghost.a-squish { animation: squish 1.8s ease-in-out infinite; transform-origin: 50% 100%; }
  #ghost.a-drift  { animation: drift 5s ease-in-out infinite; }
  #ghost.thirsty { animation: droop 5s ease-in-out infinite !important; }
  #ghost.sipping { animation: sip .45s ease-in-out infinite !important; }
  #ghost.wiggle { animation: wiggle .5s ease-in-out 6 !important; }
  @keyframes droop { 0%,100% { transform: translateY(5px) rotate(-3deg) } 50% { transform: translateY(8px) rotate(3deg) } }
  @keyframes sip { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2px) } }
  #ghost.dropping { scale: 1.1; transition: scale .15s; }
  #ghost.dropping #art { filter: brightness(1.08) drop-shadow(0 0 10px var(--accent, #7b5cff)); }
  #ghost.focusing { animation: nod 3s ease-in-out infinite !important; }
  #ghost.stretching { animation: stretch 1.1s ease-in-out 2 !important; transform-origin: 50% 100%; }
  @keyframes nod { 0%,100% { transform: translateY(0) rotate(-1.5deg) } 50% { transform: translateY(2px) rotate(1.5deg) } }
  @keyframes stretch { 0%,100% { transform: scale(1,1) } 20% { transform: scale(1.1,.86) } 60% { transform: scale(.9,1.2) translateY(-5px) } }
  #ghost:hover #art { filter: brightness(1.04); }
  #art { transition: filter .8s, opacity .8s; }
  #ghost.thirsty #art { filter: saturate(.5) brightness(.93); opacity: .82; }

  /* water glass: appears when the ghost is thirsty, click it to drink */
  #glass {
    position: absolute; left: 152px; bottom: 16px; width: 44px; height: 70px; cursor: pointer;
    opacity: 0; transform: scale(.3) translateY(10px); transform-origin: 50% 100%; pointer-events: none;
    transition: opacity .3s, transform .45s cubic-bezier(.3,1.6,.6,1);
    filter: drop-shadow(0 4px 6px rgba(60, 30, 120, .28));
  }
  #glass.show { opacity: 1; transform: none; pointer-events: auto; animation: glassbob 2.4s ease-in-out .5s infinite; }
  /* lifts the straw tip to the figurine's mouth */
  #glass.drinking { animation: none; transform: translate(-47px, 4px) rotate(-8deg); transition: opacity .4s, transform .5s ease; pointer-events: none; }
  @keyframes glassbob { 0%,100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-3px) rotate(4deg) } }
  #glass .water { transform-box: fill-box; transform-origin: 50% 100%; }
  #glass.drinking .water { transform: scaleY(.06); transition: transform 2s linear .5s; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes hover { 0%,100% { transform: translateY(0) rotate(-2deg) } 50% { transform: translateY(-6px) rotate(2deg) } }
  @keyframes squish { 0%,100% { transform: scale(1,1) } 45% { transform: scale(1.07,.92) } 70% { transform: scale(.96,1.05) translateY(-4px) } }
  @keyframes drift { 0%,100% { transform: translate(0,0) rotate(-4deg) } 50% { transform: translate(0,-9px) rotate(4deg) } }
  .tail { animation: tail 1.6s ease-in-out infinite; transform-origin: 88px 110px; transform-box: view-box; }
  @keyframes tail { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-14deg) } }
  .blinker { animation: blinker 1.4s steps(2) infinite; }
  @keyframes blinker { 50% { opacity: .25 } }
  .twinkle { animation: twinkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .twinkle.t2 { animation-delay: 1.1s; }
  @keyframes twinkle { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .3; transform: scale(.6) } }
  @keyframes wiggle { 0%,100% { rotate: 0deg } 25% { rotate: -9deg } 75% { rotate: 9deg } }

  .eye { animation: blink 4.5s infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  #ghost.happy .eye { display: none; }
  #ghost:not(.happy) .happy-eye { display: none; }

  .shadow { position: absolute; left: 50%; bottom: 6px; width: 70px; height: 10px; margin-left: -35px;
    background: radial-gradient(ellipse, rgba(60,30,120,.28), transparent 70%);
    animation: shadow 3.2s ease-in-out infinite; pointer-events: none; }
  @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .9 } 50% { transform: scaleX(.8); opacity: .55 } }

  #badge {
    position: absolute; top: 4px; right: 2px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box;
    border-radius: 11px; background: #ff5c8a; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; border: 2px solid #fff;
  }
  #badge.hidden { display: none; }

  /* focus timer */
  #phones { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0;
    transform: translateY(-14px); transition: opacity .3s, transform .4s cubic-bezier(.3,1.6,.6,1); }
  #ghost.focusing #phones { opacity: 1; transform: none; }
  #timer { position: absolute; top: 4px; left: 2px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px;
    background: var(--accent, #7b5cff); color: #fff; font-size: 12px; font-weight: 700; line-height: 18px; border: 2px solid #fff;
    font-variant-numeric: tabular-nums; display: none; }
  #ghost.focusing #timer { display: block; }
  .bit { position: absolute; left: 100px; bottom: 90px; width: 7px; height: 11px; border-radius: 2px; pointer-events: none;
    animation: burst 1.3s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes burst { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <div class="shadow"></div>
  <div id="ghost" title="Click to open your lists · drag to move · right-click for options">
    <div id="art"></div>
    <div id="badge" class="hidden">0</div>
    <svg id="phones" viewBox="0 0 112 128" aria-hidden="true">
      <path d="M15 30 L14 38 M97 30 L98 38" stroke="#a9adb3" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M15 30 C19 -2 93 -2 97 30" fill="none" stroke="var(--ph-band)" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M15 30 C19 -2 93 -2 97 30" fill="none" stroke="var(--ph-knit)" stroke-width="4.2" stroke-dasharray="1 1.6"/>
      <rect x="8" y="37" width="11" height="28" rx="5.5" fill="var(--ph-body)"/>
      <rect x="10.5" y="42" width="1.8" height="18" rx=".9" fill="var(--ph-shine)"/>
      <rect x="93" y="37" width="11" height="28" rx="5.5" fill="var(--ph-body)"/>
      <rect x="99.7" y="42" width="1.8" height="18" rx=".9" fill="var(--ph-shine)"/>
    </svg>
    <div id="timer"></div>
  </div>
  <div id="glass" title="Click to drink">
    <svg viewBox="0 0 44 70" width="44" height="70">
      <defs><clipPath id="glass-in"><path d="M8 26 L36 26 L33 64 Q33 66 31 66 L13 66 Q11 66 11 64 Z"/></clipPath></defs>
      <g fill="none" stroke-linejoin="round">
        <path d="M27 60 L19 12 L4 5" stroke="#b9b2cf" stroke-width="6.4" stroke-linecap="round"/>
        <path d="M27 60 L19 12 L4 5" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <path d="M27 60 L19 12 L4 5" stroke="#e5263a" stroke-width="5" stroke-dasharray="4 4"/>
      </g>
      <g clip-path="url(#glass-in)"><rect class="water" x="6" y="32" width="32" height="36" fill="#5cc8ff" opacity=".78"/></g>
      <path d="M8 26 L36 26 L33 64 Q33 66 31 66 L13 66 Q11 66 11 64 Z" fill="rgba(255,255,255,.3)" stroke="#9fd0ee" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M13 31 L15 58" stroke="#fff" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<script src="skins.js"></script>
<script>
  const ghostEl = document.getElementById('ghost');
  const bubble = document.getElementById('bubble');
  const badge = document.getElementById('badge');
  const glass = document.getElementById('glass');
  const timer = document.getElementById('timer');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // --- click-through: only the ghost + bubble catch the mouse ---
  let ignoring = true, dragging = false;
  function setCapture(capture) {
    if (dragging) capture = true;
    if (capture === !ignoring) return;
    ignoring = !capture;
    window.ghost.setIgnoreMouse(!capture);
  }
  window.addEventListener('mousemove', (e) => {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    setCapture(!!el && (ghostEl.contains(el) || bubble.contains(el) || glass.contains(el)));
  });
  document.addEventListener('mouseleave', () => setCapture(false));

  // --- drag vs click ---
  let start = null, moved = false;
  ghostEl.addEventListener('mousedown', async (e) => {
    if (e.button !== 0) return;
    dragging = true; moved = false;
    const [wx, wy] = await window.ghost.getPos();
    start = { sx: e.screenX, sy: e.screenY, wx, wy };
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging || !start) return;
    const dx = e.screenX - start.sx, dy = e.screenY - start.sy;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    moved = true;
    window.ghost.move(start.wx + dx, start.wy + dy);
  });
  window.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    if (moved) window.ghost.moveEnd();
    else if (e.button === 0) { hideBubble(); window.ghost.click(); }
    start = null;
  });
  ghostEl.addEventListener('contextmenu', (e) => { e.preventDefault(); window.ghost.menu(); });
  bubble.addEventListener('click', () => { hideBubble(); window.ghost.click(); });

  // Headphones are tints of one color: a skin's accent, or its own `phones` color.
  function tintHeadphones(hex) {
    const n = parseInt(hex.slice(1), 16);
    const toWhite = (p) => '#' + [16, 8, 0]
      .map((s) => Math.round(((n >> s) & 255) * (1 - p) + 255 * p).toString(16).padStart(2, '0')).join('');
    const root = document.documentElement.style;
    root.setProperty('--ph-body', toWhite(.3));
    root.setProperty('--ph-knit', toWhite(.35));
    root.setProperty('--ph-band', toWhite(.65));
    root.setProperty('--ph-shine', toWhite(.7));
  }

  // --- state ---
  let pending = 0, skinId = null;
  function applySkin(id) {
    if (id === skinId) return;
    skinId = id;
    const s = window.SKINS.get(id);
    document.getElementById('art').innerHTML = window.SKINS.render(s.id, 'fig');
    ghostEl.classList.remove('a-hover', 'a-squish', 'a-drift');
    if (s.anim !== 'float') ghostEl.classList.add('a-' + s.anim);
    document.documentElement.style.setProperty('--accent', s.accent);
    tintHeadphones(s.phones || s.accent);
  }
  function render(p) {
    applySkin(p.data.settings.skin);
    pending = p.pending;
    badge.textContent = pending > 99 ? '99+' : pending;
    badge.classList.toggle('hidden', pending === 0);
    if (!refreshed) ghostEl.classList.toggle('happy', pending === 0);
    setFocus(p.focusEndsAt);
  }
  window.ghost.getData().then(render);
  window.ghost.onData(render);

  // --- reminders ---
  let bubbleTimer = null;
  function showBubble(html, ms) {
    bubble.innerHTML = html;
    bubble.classList.remove('list');
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    if (ms) bubbleTimer = setTimeout(hideBubble, ms);
  }
  function hideBubble() { bubble.classList.remove('show'); }
  function wiggle() {
    ghostEl.classList.remove('wiggle'); void ghostEl.offsetWidth; ghostEl.classList.add('wiggle');
    clearTimeout(wiggleTimer);
    wiggleTimer = setTimeout(endWiggle, 3500);
  }

  // Task text comes from your lists and from whatever was dropped: always escape it.
  window.ghost.onSay(({ title, groups, ms }) => {
    const body = (groups || []).map((g) => [
      g.heading ? `<span class="h">${esc(g.heading)}</span>` : '',
      ...(g.items || []).map((i) => `<span class="i">${esc(i.text)}</span>${i.why ? `<span class="w">${esc(i.why)}</span>` : ''}`),
      g.more ? `<span class="w">and ${g.more} more</span>` : '',
    ].join('')).join('');
    wiggle();
    showBubble(`<b>${esc(title)}</b>${body}`, ms);
    bubble.classList.add('list');
  });

  window.ghost.onReminder(({ label, pending }) => {
    wiggle();
    const msg = pending
      ? `${label} check-in! You have <b>${pending}</b> open task${pending === 1 ? '' : 's'}. Click me to update.`
      : `${label} check-in! All clear 🎉 Anything new to add?`;
    showBubble(msg, 20 * 60 * 1000); // stays up to 20 min or until you click
  });
  window.ghost.onReminderClear(hideBubble);
  // Return to the idle face/animation after a reminder wiggle.
  let wiggleTimer = null;
  function endWiggle() { clearTimeout(wiggleTimer); ghostEl.classList.remove('wiggle'); }
  ghostEl.addEventListener('animationend', (e) => { if (e.animationName === 'wiggle') endWiggle(); });

  // --- water breaks ---
  // The ghost droops and a glass appears. Clicking the glass plays the drink
  // and tells the main process to restart the countdown.
  let thirsty = false, drinking = false, refreshed = false;
  window.ghost.onThirsty(() => {
    if (thirsty || drinking) return;
    thirsty = true;
    ghostEl.classList.add('thirsty');
    glass.classList.remove('drinking');
    glass.classList.add('show');
  });
  glass.addEventListener('click', () => {
    if (!thirsty || drinking) return;
    drinking = true;
    hideBubble();
    ghostEl.classList.remove('thirsty');
    ghostEl.classList.add('sipping');
    glass.classList.add('drinking');
    setTimeout(() => {
      ghostEl.classList.remove('sipping');
      refreshed = true;
      ghostEl.classList.add('happy');
      glass.classList.remove('show');
      window.ghost.drank();
      setTimeout(() => {
        glass.classList.remove('drinking');
        thirsty = drinking = refreshed = false;
        ghostEl.classList.toggle('happy', pending === 0);
      }, 3000);
    }, 2800);
  });

  // --- focus timer ---
  // Main owns the clock; this only draws what's left.
  let focusEnd = null, focusTick = null;
  function drawTimer() {
    const left = Math.max(0, Math.ceil((focusEnd - Date.now()) / 1000));
    timer.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  }
  function setFocus(endsAt) {
    if (endsAt === focusEnd || (!endsAt && !focusEnd)) return;
    focusEnd = endsAt;
    clearInterval(focusTick);
    ghostEl.classList.toggle('focusing', !!endsAt);
    if (endsAt) { drawTimer(); focusTick = setInterval(drawTimer, 1000); }
  }
  function confetti() {
    const stage = document.getElementById('stage');
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2, r = 55 + (i % 3) * 18;
      const bit = document.createElement('div');
      bit.className = 'bit';
      bit.style.background = ['#ff5c8a', '#ffc94d', '#5cc8ff', 'var(--accent)'][i % 4];
      bit.style.setProperty('--x', `${Math.round(Math.cos(a) * r)}px`);
      bit.style.setProperty('--y', `${Math.round(Math.sin(a) * r - 25)}px`);
      bit.style.setProperty('--r', `${i * 47}deg`);
      bit.addEventListener('animationend', () => bit.remove());
      stage.appendChild(bit);
    }
  }
  window.ghost.onFocusDone(() => {
    setFocus(null);
    ghostEl.classList.add('stretching');
    setTimeout(() => {
      ghostEl.classList.remove('stretching');
      refreshed = true;
      ghostEl.classList.add('happy');
      confetti();
      showBubble('Time’s up! Nice focus 🎉', 6000);
      setTimeout(() => { refreshed = false; ghostEl.classList.toggle('happy', pending === 0); }, 5000);
    }, 2200);
  });

  // --- drop text, a link or a file on the figurine ---
  const titleFrom = (html) => {
    if (!html) return '';
    const doc = new DOMParser().parseFromString(html, 'text/html');
    return (doc.querySelector('a') || doc.body).textContent.trim();
  };
  function readDrop(dt) {
    const files = [...dt.files];
    if (files.length) {
      return files.map((f) => ({ text: f.name, link: window.ghost.pathForFile(f) }));
    }
    const url = (dt.getData('text/uri-list') || '').split(/\r?\n/).find((l) => l && !l.startsWith('#'));
    const plain = dt.getData('text/plain');
    if (url) return [{ text: titleFrom(dt.getData('text/html')) || plain || url, link: url }];
    return plain ? [{ text: plain }] : [];
  }
  let dropDepth = 0;
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dropDepth++;
    ghostEl.classList.add('dropping');
  });
  window.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  window.addEventListener('dragleave', () => {
    if (--dropDepth <= 0) { dropDepth = 0; ghostEl.classList.remove('dropping'); }
  });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dropDepth = 0;
    ghostEl.classList.remove('dropping');
    const items = readDrop(e.dataTransfer);
    if (items.length) window.ghost.dropItems(items);
  });

  // Restart every animation from a clean state (eyes open, floating).
  function refreshAnimations() {
    endWiggle();
    // Restart by briefly removing each animation in CSS. (Calling play() on
    // them instead detaches them from CSS, so later class changes stop
    // working: the glass never moved to the mouth and animations piled up.)
    const els = new Set(document.getAnimations().map((a) => a.effect && a.effect.target).filter(Boolean));
    els.forEach((el) => { if (!glass.contains(el)) el.style.animationName = 'none'; });
    void document.body.offsetWidth;
    els.forEach((el) => { el.style.animationName = ''; });
  }
  window.ghost.onRefreshAnim(refreshAnimations);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAnimations(); });

  // friendly hello on launch
  setTimeout(() => { if (!bubble.classList.contains('show')) showBubble('Hi! Click me to open your lists 👋', 5000); }, 800);
</script>
</body>
</html>
