<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; user-select: none; }
  #stage { position: absolute; inset: 0; }

  /* speech bubble */
  #bubble {
    position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%) scale(.6);
    width: 168px; box-sizing: border-box; padding: 9px 12px;
    background: #fff; color: #2b2540; border-radius: 14px; font-size: 12.5px; line-height: 1.35;
    box-shadow: 0 6px 20px rgba(40, 20, 80, .22); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s cubic-bezier(.3,1.6,.6,1);
    cursor: pointer;
  }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
    border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
  #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }
  #bubble b { color: var(--accent, #7b5cff); }

  /* ghost */
  #ghost {
    position: absolute; left: 50%; bottom: 14px; width: 112px; height: 128px; margin-left: -56px;
    cursor: grab; animation: float 3.2s ease-in-out infinite;
    filter: drop-shadow(0 8px 12px rgba(60, 30, 120, .25));
  }
  #ghost:active { cursor: grabbing; }
  #art { width: 100%; height: 100%; }
  #ghost.a-hover  { animation: hover 2.4s ease-in-out infinite; }
  #ghost.a-squish { animation: squish 1.8s ease-in-out infinite; transform-origin: 50% 100%; }
  #ghost.a-drift  { animation: drift 5s ease-in-out infinite; }
  #ghost.wiggle { animation: wiggle .5s ease-in-out 6 !important; }
  #ghost:hover #art { filter: brightness(1.04); }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes hover { 0%,100% { transform: translateY(0) rotate(-2deg) } 50% { transform: translateY(-6px) rotate(2deg) } }
  @keyframes squish { 0%,100% { transform: scale(1,1) } 45% { transform: scale(1.07,.92) } 70% { transform: scale(.96,1.05) translateY(-4px) } }
  @keyframes drift { 0%,100% { transform: translate(0,0) rotate(-4deg) } 50% { transform: translate(0,-9px) rotate(4deg) } }
  .tail { animation: tail 1.6s ease-in-out infinite; transform-origin: 88px 110px; transform-box: view-box; }
  @keyframes tail { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-14deg) } }
  .blinker { animation: blinker 1.4s steps(2) infinite; }
  @keyframes blinker { 50% { opacity: .25 } }
  .twinkle { animation: twinkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .twinkle.t2 { animation-delay: 1.1s; }
  @keyframes twinkle { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .3; transform: scale(.6) } }
  @keyframes wiggle { 0%,100% { rotate: 0deg } 25% { rotate: -9deg } 75% { rotate: 9deg } }

  .eye { animation: blink 4.5s infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  #ghost.happy .eye { display: none; }
  #ghost:not(.happy) .happy-eye { display: none; }

  .shadow { position: absolute; left: 50%; bottom: 6px; width: 70px; height: 10px; margin-left: -35px;
    background: radial-gradient(ellipse, rgba(60,30,120,.28), transparent 70%);
    animation: shadow 3.2s ease-in-out infinite; pointer-events: none; }
  @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .9 } 50% { transform: scaleX(.8); opacity: .55 } }

  #badge {
    position: absolute; top: 4px; right: 2px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box;
    border-radius: 11px; background: #ff5c8a; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; border: 2px solid #fff;
  }
  #badge.hidden { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <div class="shadow"></div>
  <div id="ghost" title="Click to open your lists · drag to move · right-click for options">
    <div id="art"></div>
    <div id="badge" class="hidden">0</div>
  </div>
</div>

<script src="skins.js"></script>
<script>
  const ghostEl = document.getElementById('ghost');
  const bubble = document.getElementById('bubble');
  const badge = document.getElementById('badge');

  // --- click-through: only the ghost + bubble catch the mouse ---
  let ignoring = true, dragging = false;
  function setCapture(capture) {
    if (dragging) capture = true;
    if (capture === !ignoring) return;
    ignoring = !capture;
    window.ghost.setIgnoreMouse(!capture);
  }
  window.addEventListener('mousemove', (e) => {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    setCapture(!!el && (ghostEl.contains(el) || bubble.contains(el)));
  });
  document.addEventListener('mouseleave', () => setCapture(false));

  // --- drag vs click ---
  let start = null, moved = false;
  ghostEl.addEventListener('mousedown', async (e) => {
    if (e.button !== 0) return;
    dragging = true; moved = false;
    const [wx, wy] = await window.ghost.getPos();
    start = { sx: e.screenX, sy: e.screenY, wx, wy };
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging || !start) return;
    const dx = e.screenX - start.sx, dy = e.screenY - start.sy;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    moved = true;
    window.ghost.move(start.wx + dx, start.wy + dy);
  });
  window.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    if (moved) window.ghost.moveEnd();
    else if (e.button === 0) { hideBubble(); window.ghost.click(); }
    start = null;
  });
  ghostEl.addEventListener('contextmenu', (e) => { e.preventDefault(); window.ghost.menu(); });
  bubble.addEventListener('click', () => { hideBubble(); window.ghost.click(); });

  // --- state ---
  let pending = 0, skinId = null;
  function applySkin(id) {
    if (id === skinId) return;
    skinId = id;
    const s = window.SKINS.get(id);
    document.getElementById('art').innerHTML = window.SKINS.render(s.id, 'fig');
    ghostEl.classList.remove('a-hover', 'a-squish', 'a-drift');
    if (s.anim !== 'float') ghostEl.classList.add('a-' + s.anim);
    document.documentElement.style.setProperty('--accent', s.accent);
  }
  function render(p) {
    applySkin(p.data.settings.skin);
    pending = p.pending;
    badge.textContent = pending > 99 ? '99+' : pending;
    badge.classList.toggle('hidden', pending === 0);
    ghostEl.classList.toggle('happy', pending === 0);
  }
  window.ghost.getData().then(render);
  window.ghost.onData(render);

  // --- reminders ---
  let bubbleTimer = null;
  function showBubble(html, ms) {
    bubble.innerHTML = html;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    if (ms) bubbleTimer = setTimeout(hideBubble, ms);
  }
  function hideBubble() { bubble.classList.remove('show'); }

  window.ghost.onReminder(({ label, pending }) => {
    ghostEl.classList.remove('wiggle'); void ghostEl.offsetWidth; ghostEl.classList.add('wiggle');
    clearTimeout(wiggleTimer);
    wiggleTimer = setTimeout(endWiggle, 3500); // backup in case animationend never fires
    const msg = pending
      ? `${label} check-in! You have <b>${pending}</b> open task${pending === 1 ? '' : 's'}. Click me to update.`
      : `${label} check-in! All clear 🎉 Anything new to add?`;
    showBubble(msg, 20 * 60 * 1000); // stays up to 20 min or until you click
  });
  window.ghost.onReminderClear(hideBubble);
  // Return to the idle face/animation after a reminder wiggle.
  let wiggleTimer = null;
  function endWiggle() { clearTimeout(wiggleTimer); ghostEl.classList.remove('wiggle'); }
  ghostEl.addEventListener('animationend', (e) => { if (e.animationName === 'wiggle') endWiggle(); });

  // Restart every animation from a clean state (eyes open, floating).
  function refreshAnimations() {
    endWiggle();
    document.getAnimations().forEach((a) => {
      if (a.animationName === 'wiggle') return a.cancel();
      a.currentTime = 0;
      a.play();
    });
  }
  window.ghost.onRefreshAnim(refreshAnimations);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAnimations(); });

  // friendly hello on launch
  setTimeout(() => showBubble('Hi! Click me to open your lists 👋', 5000), 800);
</script>
</body>
</html>
